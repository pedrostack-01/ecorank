spring.application.name=ecorank

# Porta do servidor (o Render informa a porta na variavel PORT)
server.port=${PORT:8080}

# String de conexao (URL) do banco de dados Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}

# Credenciais (no Render use as variaveis de ambiente DB_USER e DB_PASSWORD)
spring.datasource.username=${DB_USER:RM570464}
spring.datasource.password=${DB_PASSWORD:180408}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexoes pequeno para nao estourar o limite do banco
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
